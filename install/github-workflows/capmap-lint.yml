# GitHub 仅识别 .github/workflows/；业务逻辑在 capmap-lint skill（action.yml + capmap_lint.py）。
# 安装：复制到业务仓 .github/workflows/capmap-lint.yml
# 按实际 docs_root 改 paths（下面默认 docs/**）。
name: capmap-lint

on:
  push:
    paths:
      - "docs/**"
      - ".agents/skills/capmap-*/**"
      - ".github/workflows/capmap-lint.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".agents/skills/capmap-*/**"
      - ".github/workflows/capmap-lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.agents/skills/capmap-lint
